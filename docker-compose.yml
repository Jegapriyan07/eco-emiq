version: '3.8'

services:
  # PostgreSQL - Primary Database
  postgres:
    image: postgres:14-alpine
    container_name: ecotronics-postgres
    environment:
      POSTGRES_USER: ecotronics
      POSTGRES_PASSWORD: dev_password_change_in_prod
      POSTGRES_DB: ecotronics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecotronics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TimescaleDB - Time-Series Data
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: ecotronics-timescaledb
    environment:
      POSTGRES_USER: ecotronics
      POSTGRES_PASSWORD: dev_password_change_in_prod
      POSTGRES_DB: ecotronics_timeseries
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecotronics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: ecotronics-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: ecotronics-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MQTT Broker - Device Communication
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ecotronics-mosquitto
    ports:
      - "1883:1883"
      - "9883:9883"
    volumes:
      - ./infrastructure/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Auth Service
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: ecotronics-auth-service
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://ecotronics:dev_password_change_in_prod@postgres:5432/ecotronics
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_prod
      JWT_EXPIRES_IN: 7d
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/auth-service:/app
      - /app/node_modules
    command: npm run dev

  # Device Service
  device-service:
    build:
      context: ./backend/device-service
      dockerfile: Dockerfile
    container_name: ecotronics-device-service
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://ecotronics:dev_password_change_in_prod@postgres:5432/ecotronics
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    volumes:
      - ./backend/device-service:/app
      - /app/node_modules
    command: npm run dev

  # Data Ingestion Service
  data-ingestion-service:
    build:
      context: ./backend/data-ingestion-service
      dockerfile: Dockerfile
    container_name: ecotronics-data-ingestion
    environment:
      NODE_ENV: development
      PORT: 3003
      TIMESCALE_URL: postgresql://ecotronics:dev_password_change_in_prod@timescaledb:5432/ecotronics_timeseries
      REDIS_URL: redis://redis:6379
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      AUTH_SERVICE_URL: http://auth-service:3001
    ports:
      - "3003:3003"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    volumes:
      - ./backend/data-ingestion-service:/app
      - /app/node_modules
    command: npm run dev

  # Analytics Service
  analytics-service:
    build:
      context: ./backend/analytics-service
      dockerfile: Dockerfile
    container_name: ecotronics-analytics
    environment:
      NODE_ENV: development
      PORT: 3004
      TIMESCALE_URL: postgresql://ecotronics:dev_password_change_in_prod@timescaledb:5432/ecotronics_timeseries
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
    ports:
      - "3004:3004"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/analytics-service:/app
      - /app/node_modules
    command: npm run dev

  # API Gateway (Nginx)
  api-gateway:
    image: nginx:alpine
    container_name: ecotronics-gateway
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - device-service
      - data-ingestion-service
      - analytics-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  timescale_data:
  redis_data:
  minio_data:
  mosquitto_data:
  mosquitto_logs:

networks:
  default:
    name: ecotronics-network
