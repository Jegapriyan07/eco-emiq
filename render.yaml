# EcoTronics — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Frontend MUST be a Web Service (not Static Site).
# Render Static Site rewrites are unreliable here: /home and /login return
# empty 0-byte bodies, causing blank pages on refresh/back/logout.
#
# Manual Web Service settings (if not using Blueprint):
#   Root Directory: frontend
#   Runtime: Node
#   Build: npm install && npm run build
#   Start: npm start
#   Env: VITE_ML_API_URL=https://emiq-ml.onrender.com/api/v1/ml

services:
  - type: web
    name: ecotronics-ml
    runtime: python
    rootDir: ml-service
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecotronics-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: ecotronics-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_ML_API_URL
        value: https://emiq-ml.onrender.com/api/v1/ml

databases:
  - name: ecotronics-db
    plan: free
    databaseName: ecotronics
    user: ecotronics
