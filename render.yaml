# EcoTronics — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# After first deploy:
# 1. Copy the ML Web Service URL
# 2. Set Static Site env VITE_ML_API_URL=https://<ml-service>.onrender.com/api/v1/ml
# 3. Trigger a Static Site rebuild (Vite bakes env at build time)
# 4. Seed DB once: from ML service shell → python scripts/seed_demo_db.py

services:
  - type: web
    name: ecotronics-ml
    runtime: python
    rootDir: ml-service
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecotronics-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: ecotronics-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Replace after ML service is live, then rebuild this site
      - key: VITE_ML_API_URL
        value: https://ecotronics-ml.onrender.com/api/v1/ml

databases:
  - name: ecotronics-db
    plan: free
    databaseName: ecotronics
    user: ecotronics
